<main class="container">

<section class="lado-esquerdo">

<img src="img/ranger.png" alt="Ford Ranger">

</section>

<section class="lado-direito">

<img class="logo" src="img/ford.png" alt="Ford">

<h2>Boas-vindas</h2>

<form (ngSubmit)="login()">

  <input
    type="text"
    name="usuario"
    [(ngModel)]="usuario.nome"
    placeholder="Insira seu usuário"
    required
  >

  <input
    type="password"
    name="senha"
    [(ngModel)]="usuario.senha"
    placeholder="Insira sua senha"
    required
  >

  <label class="check">
    <input type="checkbox">
    Logar automaticamente
  </label>

  @if (mensagemErro) {
    <p class="erro">
      {{ mensagemErro }}
    </p>
  }

  <button type="submit">
    Entrar
  </button>

</form>

</section>

</main>
